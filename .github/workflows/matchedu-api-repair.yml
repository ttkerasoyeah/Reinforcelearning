name: MatchEdu API repair

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  repair:
    if: github.event.issue.pull_request && github.event.comment.body == '/repair2-matchedu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'feature/matchedu-predictive-system-20260822';
            const path = 'matchedu/MatchEdu_条件式路径预测与真实确认_三语完整交互版_20260822.html';
            const response = await github.rest.repos.getContent({owner, repo, path, ref: branch});
            const file = response.data;
            let text = Buffer.from(file.content, 'base64').toString('utf8');
            const patches = [
              ["Only route-changing facts')):i===2", "Only route-changing facts'))):i===2"],
              ["Time, budget, participation')):i===3", "Time, budget, participation'))):i===3"],
              ["Exclude unacceptable outcomes')):esc", "Exclude unacceptable outcomes'))):esc"]
            ];
            const applied = [];
            for (const [from, to] of patches) {
              if (text.includes(from)) {
                text = text.replace(from, to);
                applied.push(from);
              }
            }
            const scripts = [...text.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m => m[1]);
            let syntax = 'PASS';
            let syntaxError = '';
            try {
              new Function(scripts.join('\n'));
            } catch (error) {
              syntax = 'FAIL';
              syntaxError = String(error && error.stack ? error.stack : error).slice(0, 3000);
            }
            if (syntax === 'PASS') {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch,
                message: 'fix: repair MatchEdu JavaScript syntax',
                sha: file.sha,
                content: Buffer.from(text, 'utf8').toString('base64')
              });
            }
            await github.rest.issues.createComment({
              owner, repo,
              issue_number: context.issue.number,
              body: `## MatchEdu API repair\n\n- Applied replacements: ${applied.length}\n- JavaScript syntax: **${syntax}**\n${syntaxError ? `\n\`\`\`text\n${syntaxError}\n\`\`\`` : ''}`
            });
