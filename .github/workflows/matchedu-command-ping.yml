name: MatchEdu command diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ping:
    if: github.event.issue.pull_request && github.event.comment.body == '/ping-matchedu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'MatchEdu command workflow is active.'
            })

  repair:
    if: github.event.issue.pull_request && github.event.comment.body == '/repair-matchedu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/matchedu-predictive-system-20260822
          fetch-depth: 0
          persist-credentials: true
      - name: Locate HTML
        id: locate
        run: |
          FILE=$(find matchedu -type f -name '*.html' | head -n 1)
          test -n "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
      - name: Repair planner renderer
        env:
          FILE: ${{ steps.locate.outputs.file }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['FILE']); s=p.read_text(encoding='utf-8')
          if 'function plannerStepHint(i)' not in s:
              start=s.index('function renderPlanner(root){')
              end=s.index('function renderPlannerStep(){')
              replacement=r'''function plannerStepHint(i){
 const hints=[
  T('可多选并自由填写','複数選択と自由記述','Multi-select and free text'),
  T('只填影响路线的事实','ルートを変える事実のみ','Only route-changing facts'),
  T('时间、预算、参与方式','時間、予算、参加形態','Time, budget, participation'),
  T('筛除不愿承担的结果','避けたい結果を除外','Exclude unacceptable outcomes'),
  T('显示依据和未知项','根拠と未確認を表示','Show evidence and unknowns')
 ];
 return local(hints[i]||hints[0]);
}
function renderPlanner(root){
 const d=I18N[state.lang],steps=plannerSteps();
 root.innerHTML=`<section class="view"><div class="workspace"><aside class="rail"><div class="rail-title"><strong>${esc(d.plannerTitle)}</strong><span>${esc(d.plannerLead)}</span></div><div class="rail-list">${steps.map((stepLabel,i)=>`<button class="rail-btn ${state.plannerStep===i?'active':''} ${state.plannerStep>i?'done':''}" data-step="${i}"><i>${i+1}</i><span><b>${esc(stepLabel)}</b><span>${esc(plannerStepHint(i))}</span></span><em></em></button>`).join('')}</div><div class="rail-foot">${esc(local(T('所有初步路线永久免费。','初期ルートはすべて無料。','All initial routes are free.')))}</div></aside><div class="content">${pageHead('FREE PLANNER',d.plannerTitle,d.plannerLead,`<button class="btn soft" data-go="routes">${esc(d.navRoutes)}</button>`)}<div class="panel" id="plannerPanel"></div></div></div></section>`;
 renderPlannerStep();
 document.querySelectorAll('[data-step]').forEach(button=>{
  button.onclick=()=>{
   capturePlanner();
   state.plannerStep=Number(button.dataset.step);
   render();
   saveState();
  };
 });
}
'''
              s=s[:start]+replacement+s[end:]
              p.write_text(s,encoding='utf-8')
              print('planner renderer repaired')
          else:
              print('planner renderer already repaired')
          PY
      - name: Check JavaScript and write report
        id: syntax
        env:
          FILE: ${{ steps.locate.outputs.file }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,os
          text=Path(os.environ['FILE']).read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          set +e
          node --check /tmp/app.js >/tmp/node-check.txt 2>&1
          CODE=$?
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          {
            echo '## MatchEdu syntax repair'
            echo
            if [ "$CODE" -eq 0 ]; then
              echo '✅ JavaScript syntax passes after the targeted repair.'
            else
              echo '❌ JavaScript syntax still fails after the targeted repair.'
            fi
            echo
            echo '```text'
            tail -n 40 /tmp/node-check.txt
            echo '```'
          } >/tmp/matchedu-report.md
      - name: Post repair report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file /tmp/matchedu-report.md
      - name: Commit repaired HTML
        if: steps.syntax.outputs.code == '0'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add matchedu/*.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'fix: repair MatchEdu planner renderer syntax'
            git push origin HEAD:feature/matchedu-predictive-system-20260822
          fi
