const rankJP=v=>({none:0,N5:1,N4:2,N3:3,N2:4,N1:5}[v]??0);
function routeData(source=state){
 return routes.map(r=>{
  const goalFit=Math.min(100,35+(r.goals.filter(g=>source.goals.includes(g)).length*24));
  const jpGap=Math.max(0,rankJP(r.jp)-rankJP(source.jp));
  const budgetGap=Math.max(0,r.minBudget-source.budget);
  const timeGap=Math.max(0,r.minMonths-source.months);
  const modeOk=r.mode.includes(source.mode)||source.mode==='flexible';
  const hard=[];if(jpGap)hard.push(local(T('日语需提升','日本語強化が必要','Japanese level must improve')));if(budgetGap)hard.push(local(T('预算低于建议下限','予算が目安未満','Budget is below the suggested minimum')));if(timeGap)hard.push(local(T('准备期不足','準備期間不足','Preparation time is short')));if(!modeOk)hard.push(local(T('参与方式不匹配','参加形態が不一致','Participation mode mismatch')));
  let score=goalFit-(jpGap*10)-Math.min(24,budgetGap/4)-Math.min(18,timeGap*2)+(source.project?6:0)+(r.reversible==='very-high'?5:r.reversible==='high'?3:0);
  if(source.goals.includes('online')&&r.id==='online')score+=20;if(source.goals.includes('startup')&&r.id==='industry')score+=20;if(source.avoid.includes('highDebt')&&r.cost[1]>200)score-=12;if(source.avoid.includes('singlePoint')&&(r.id==='direct'||r.id==='research-student'))score-=5;
  score=Math.max(18,Math.min(96,Math.round(score)));
  const evidenceScore=r.id==='online'?82:r.id==='strengthen'?74:r.id==='industry'?63:r.id==='direct'?69:65;
  return Object.assign({},r,{score,goalFit,evidenceScore,hard,feasible:hard.length===0,status:hard.length===0?'ready':hard.length<=2?'conditional':'blocked'});
 }).sort((a,b)=>b.score-a.score);
}

html+=`<div class="action-bar"><button class="btn secondary" id="plannerBack" ${s===0?'disabled':''}>${esc(d.back)}</button><div class="button-row">${s<4?`<button class="btn primary" id="plannerNext">${esc(d.next)}</button>`:`<button class="btn green" id="plannerGenerate">${esc(d.generate)}</button>`}</div></div>`;p.innerHTML=html;bindPlannerInputs();const back=document.getElementById('plannerBack');if(back)back.onclick=()=>{capturePlanner();state.plannerStep=Math.max(0,s-1);render()};const next=document.getElementById('plannerNext');if(next)next.onclick=()=>{capturePlanner();state.plannerStep=Math.min(4,s+1);render()};const gen=document.getElementById('plannerGenerate');if(gen)gen.onclick=()=>{capturePlanner();state.selectedRoute=routeData()[0].id;toast(local(T('免费路线已生成。','無料ルートを生成しました。','Free routes generated.')));go('routes')}}
function bindPlannerInputs(){document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{const k=b.dataset.goal;state.goals=state.goals.includes(k)?state.goals.filter(x=>x!==k):state.goals.concat(k);if(!state.goals.length)state.goals=['research'];render()});const by=id=>document.getElementById(id);if(by('education'))by('education').value=state.education;if(by('major'))by('major').value=state.major;if(by('jp'))by('jp').value=state.jp;if(by('en'))by('en').value=state.en;if(by('mode'))by('mode').value=state.mode;document.querySelectorAll('[data-avoid]').forEach(x=>x.onchange=()=>{const k=x.dataset.avoid;state.avoid=x.checked?[...new Set(state.avoid.concat(k))]:state.avoid.filter(v=>v!==k);saveState()})}
function capturePlanner(){const get=id=>document.getElementById(id);if(get('freeGoal'))state.freeGoal=get('freeGoal').value;if(get('education'))state.education=get('education').value;if(get('major'))state.major=get('major').value;if(get('jp'))state.jp=get('jp').value;if(get('en'))state.en=get('en').value;if(get('project'))state.project=get('project').checked;if(get('budget'))state.budget=Math.max(0,Number(get('budget').value)||0);if(get('cash'))state.cash=Math.max(0,Number(get('cash').value)||0);if(get('months'))state.months=Math.max(1,Number(get('months').value)||1);if(get('mode'))state.mode=get('mode').value;if(get('inJapan'))state.inJapan=get('inJapan').checked;if(get('delay'))state.delay=get('delay').checked;if(get('localCity'))state.localCity=get('localCity').checked;saveState()}
function statusLabel(s){return s==='ready'?local(T('当前可行','現在実行可能','Currently feasible')):s==='conditional'?local(T('条件可行','条件付き実行可能','Conditionally feasible')):local(T('存在硬冲突','必須条件の衝突','Hard conflict'))}
function renderRoutes(root){const d=I18N[state.lang],data=routeData();root.innerHTML=`<section class="view">${pageHead('EXPLAINABLE ROUTES',d.routesTitle,d.routesLead,`<button class="btn secondary" data-go="scenario">${esc(d.navScenario)}</button><button class="btn primary" data-go="resources">${esc(d.navResources)}</button>`)}<div class="priority-note"><b>${esc(d.notProbability)}</b><br>${esc(local(T('优先级由目标覆盖、硬条件、时间、预算、证据和可逆性构成。任何机构回复都可能改变它。','優先度は目標、必須条件、時間、予算、根拠、可逆性で構成され、機関回答で変わります。','Priority combines goal coverage, hard constraints, time, budget, evidence and reversibility. Any provider reply may change it.')))}</div><div class="route-grid" style="margin-top:13px">${data.map((r,i)=>`<article class="route-card ${i===0?'featured':''}" style="--tone:${r.tone};--tone-soft:${r.soft}"><div class="route-top"><div class="route-icon">${i+1}</div><div class="route-priority"><strong>${r.score}</strong><span>${esc(d.priority)}</span></div></div><h3>${esc(local(r.name))}</h3><p>${esc(local(r.desc))}</p><div class="factor-box"><small>${esc(local(T('为什么出现','表示理由','WHY THIS ROUTE')))}</small><strong>${esc(local(T('目标覆盖','目標適合','Goal fit')))} ${r.goalFit}% · ${r.hard.length?esc(local(T('仍有硬门槛需处理','必須条件の対応が必要','Hard constraints still need action'))):esc(local(T('未发现明显硬冲突','明確な必須条件衝突なし','No clear hard conflict found')))}</strong></div><div class="route-metrics"><div class="metric"><span>${esc(local(T('时间','時間','Time')))}</span><b>${r.time[0]}–${r.time[1]} ${esc(local(T('月','か月','mo')))}</b></div><div class="metric"><span>${esc(local(T('投入区间','投入範囲','Cost range')))}</span><b>${r.cost[0]}–${r.cost[1]} ${esc(local(T('万日元','万円','×JPY10k')))}</b></div><div class="metric"><span>${esc(local(T('证据强度','根拠強度','Evidence')))}</span><b>${r.evidenceScore}/100</b></div></div><div class="route-evidence"><div class="evidence-line ${r.hard.length?'warn':''}"><i>${r.hard.length?'!':'✓'}</i><span><b>${esc(statusLabel(r.status))}</b> ${r.hard.length?': '+r.hard.map(esc).join('；'):''}</span></div><div class="evidence-line"><i>↻</i><span>${esc(local(T('可逆性','可逆性','Reversibility')))}：${esc(r.reversible)}</span></div><div class="evidence-line warn"><i>!</i><span>${esc(local(r.risk))}</span></div></div><div class="route-first"><span>${esc(local(T('现在第一步','最初の行動','First action now')))}</span><b>${esc(local(r.first))}</b></div><div class="route-actions"><button class="btn primary" data-select-route="${r.id}">${esc(local(T('设为活跃路线','主ルートに設定','Set as active route')))}</button><button class="btn secondary" data-go="graph">${esc(local(T('查看推理路径','推論経路を見る','View reasoning path')))}</button></div></article>`).join('')}</div></section>`;document.querySelectorAll('[data-select-route]').forEach(b=>b.onclick=()=>{state.selectedRoute=b.dataset.selectRoute;toast(local(T('活跃路线已更新。','主ルートを更新しました。','Active route updated.')));saveState();render()})}
function renderScenario(root){const d=I18N[state.lang],s=state.scenario;root.innerHTML=`<section class="view">${pageHead('WHAT-IF SIMULATION',d.scenarioTitle,d.scenarioLead,`<button class="btn secondary" id="resetScenario">${esc(local(T('恢复基线','基準に戻す','Reset baseline')))}</button>`)}<div class="scenario-layout"><div class="panel scenario-controls"><h3>${esc(local(T('调整条件','条件を変更','Adjust conditions')))}</h3><div class="field"><label>${esc(local(T('日语','日本語','Japanese')))}</label><select class="control" id="simJp">${['none','N5','N4','N3','N2','N1'].map(v=>`<option value="${v}">${v}</option>`).join('')}</select></div><div class="range-row"><label>${esc(local(T('年度预算','年間予算','Annual budget')))}</label><input id="simBudget" type="range" min="0" max="300" step="5" value="${s.budget}"><output id="simBudgetOut">${s.budget}</output></div><div class="range-row"><label>${esc(local(T('准备时间（月）','準備期間（月）','Preparation months')))}</label><input id="simMonths" type="range" min="1" max="36" step="1" value="${s.months}"><output id="simMonthsOut">${s.months}</output></div><div class="check-grid"><label class="check-card"><input type="checkbox" id="simProject" ${s.project?'checked':''}><div><b>${esc(local(T('已有项目成果','成果物あり','Has project evidence')))}</b></div></label><label class="check-card"><input type="checkbox" id="simJapan" ${s.inJapan?'checked':''}><div><b>${esc(local(T('日本在籍/在日','国内在籍/在日','Japan enrollment/presence')))}</b></div></label></div><div class="priority-note">${esc(local(T('这里展示“改变某个条件后，候选路线如何变化”。它不是因果结论，除非具备足够数据和明确假设。','条件変更で候補ルートがどう変わるかを示します。十分なデータと仮定なしに因果結論とはしません。','This shows how candidate routes change under modified conditions. It is not a causal conclusion without sufficient data and explicit assumptions.')))}</div></div><div class="scenario-result" id="scenarioResult"></div></div></section>`;document.getElementById('simJp').value=s.jp;['simJp','simBudget','simMonths','simProject','simJapan'].forEach(id=>document.getElementById(id).oninput=()=>{state.scenario.jp=document.getElementById('simJp').value;state.scenario.budget=Number(document.getElementById('simBudget').value);state.scenario.months=Number(document.getElementById('simMonths').value);state.scenario.project=document.getElementById('simProject').checked;state.scenario.inJapan=document.getElementById('simJapan').checked;document.getElementById('simBudgetOut').textContent=state.scenario.budget;document.getElementById('simMonthsOut').textContent=state.scenario.months;renderScenarioResult();saveState()});document.getElementById('resetScenario').onclick=()=>{state.scenario={jp:state.jp,budget:state.budget,months:state.months,project:state.project,inJapan:state.inJapan};render()};renderScenarioResult()}
function renderScenarioResult(){const el=document.getElementById('scenarioResult');if(!el)return;const base=routeData(state);const simInput=Object.assign({},state,{jp:state.scenario.jp,budget:state.scenario.budget,months:state.scenario.months,project:state.scenario.project,inJapan:state.scenario.inJapan});const sim=routeData(simInput);const b=base[0],s=sim[0];const changes=[['日语/Japanese',rankJP(state.scenario.jp)-rankJP(state.jp)],['预算/Budget',state.scenario.budget-state.budget],['时间/Time',state.scenario.months-state.months],['项目/Project',state.scenario.project===state.project?0:state.scenario.project?1:-1],['在日/Japan',state.scenario.inJapan===state.inJapan?0:state.scenario.inJapan?1:-1]];el.innerHTML=`<div class="panel"><div class="section-head"><div><h3>${esc(local(T('基线与模拟结果','基準とシミュレーション','Baseline vs simulated result')))}</h3><p>${esc(local(T('系统重新运行硬条件过滤与优先级比较。','必須条件フィルタと優先度比較を再実行します。','Hard-constraint filtering and route comparison are rerun.')))}</p></div></div><div class="comparison"><div class="comparison-card"><span class="tag">BASELINE</span><h3 style="margin-top:11px">${esc(local(b.name))}</h3><div class="comparison-list"><div class="comparison-row"><span>${esc(I18N[state.lang].priority)}</span><b>${b.score}</b></div><div class="comparison-row"><span>${esc(local(T('状态','状態','Status')))}</span><b>${esc(statusLabel(b.status))}</b></div><div class="comparison-row"><span>${esc(local(T('第一步','最初','First action')))}</span><b>${esc(local(b.first))}</b></div></div></div><div class="comparison-arrow">→</div><div class="comparison-card sim"><span class="tag green">SIMULATED</span><h3 style="margin-top:11px">${esc(local(s.name))}</h3><div class="comparison-list"><div class="comparison-row"><span>${esc(I18N[state.lang].priority)}</span><b>${s.score} (${s.score-b.score>=0?'+':''}${s.score-b.score})</b></div><div class="comparison-row"><span>${esc(local(T('状态','状態','Status')))}</span><b>${esc(statusLabel(s.status))}</b></div><div class="comparison-row"><span>${esc(local(T('第一步','最初','First action')))}</span><b>${esc(local(s.first))}</b></div></div></div></div></div><div class="panel"><h3>${esc(local(T('敏感性：哪些条件最影响当前路线','感度：どの条件が最も影響するか','Sensitivity: which conditions affect the route most')))}</h3><div class="sensitivity">${changes.map(([n,v],i)=>{const widths=[Math.min(100,Math.abs(v)*20),Math.min(100,Math.abs(v)/2),Math.min(100,Math.abs(v)*5),Math.abs(v)*55,Math.abs(v)*45];const colors=['#3475f4','#0d7b58','#a96707','#6445b7','#0f8e9f'];return `<div class="sens-row"><span>${esc(n)}</span><div class="sens-bar"><i style="width:${widths[i]}%;background:${colors[i]}"></i></div><b>${v===0?'—':v>0?'↑ '+v:'↓ '+Math.abs(v)}</b></div>`}).join('')}</div></div><div class="panel"><h3>${esc(local(T('本次模拟的关键假设','今回シミュレーションの主要仮定','Key assumptions in this simulation')))}</h3><div class="assumption-list"><div class="assumption"><b>${esc(local(T('路线规则是演示规则','ルート規則はデモ','Route rules are demo rules')))}</b><p>${esc(local(T('真实上线需要逐校、逐研究科、逐年度维护。','本番では大学・研究科・年度ごとの更新が必要。','Production requires institution-, school- and year-specific maintenance.')))}</p></div><div class="assumption"><b>${esc(local(T('机构名额与接收意愿未知','機関の定員・受入意向は未確認','Provider capacity and willingness are unknown')))}</b><p>${esc(local(T('必须通过Intent或正式入口确认。','Intentまたは正式窓口で確認が必要。','Must be confirmed through Intent or an official channel.')))}</p></div><div class="assumption"><b>${esc(local(T('费用为比较区间','費用は比較範囲','Costs are comparison ranges')))}</b><p>${esc(local(T('正式费用以机构最新资料为准。','正式費用は最新の機関資料を優先。','Formal costs follow the provider’s latest official information.')))}</p></div></div></div>`}

function renderGraph(root){const d=I18N[state.lang];root.innerHTML=`<section class="view">${pageHead('PATH REASONING',d.graphTitle,d.graphLead,`<button class="btn secondary" data-go="evidence">${esc(d.navEvidence)}</button>`)}<div class="graph-wrap"><svg viewBox="0 0 1320 610" role="img" aria-label="Path graph">${graphEdges.map(([a,b])=>{const n1=graphNodes.find(n=>n.id===a),n2=graphNodes.find(n=>n.id===b);return `<path class="graph-edge" data-edge="${a}-${b}" d="M ${n1.x} ${n1.y} C ${(n1.x+n2.x)/2} ${n1.y}, ${(n1.x+n2.x)/2} ${n2.y}, ${n2.x} ${n2.y}"/>`}).join('')}${graphNodes.map(n=>`<g class="graph-node ${n.id===state.graphNode?'active':''}" data-node="${n.id}" transform="translate(${n.x},${n.y})"><circle r="46"></circle><text text-anchor="middle" y="-2">${esc(local(n.name))}</text><text class="sub" text-anchor="middle" y="15">${esc(local(n.sub))}</text></g>`).join('')}</svg><div class="graph-detail" id="graphDetail"></div></div></section>`;if(!state.graphNode)state.graphNode='intent';renderGraphDetail();document.querySelectorAll('[data-node]').forEach(n=>n.onclick=()=>{state.graphNode=n.dataset.node;render()})}
function renderGraphDetail(){const el=document.getElementById('graphDetail');if(!el)return;const n=graphNodes.find(x=>x.id===state.graphNode)||graphNodes[0];const desc={profile:T('用户控制的目标和现实条件，是所有路线的起点。','利用者が管理する目標と現実条件が全ルートの起点。','User-controlled goals and real constraints start every route.'),rules:T('学历、语言、身份、期限和预算硬门槛先于相似度。','学歴、言語、在籍、期限、予算の必須条件を類似度より先に処理。','Degree, language, status, deadlines and budget precede similarity.'),course:T('用于补足可以复用的能力、课程、作品或正式证明。','再利用可能な能力、科目、成果物、正式証明を補う。','Build reusable skills, courses, portfolio or formal evidence.'),'lab-a':T('公开资料支持研究方向候选，但容量和个案条件仍需确认。','公開情報で方向候補だが、定員と個別条件は要確認。','Public data supports research fit, but capacity and individual conditions need confirmation.'),'lab-b':T('作为替代节点，降低一个研究室关闭造成的整体失败。','代替ノードとして単一研究室の失敗を防ぐ。','Alternative node that reduces failure from one lab closing.'),'industry-program':T('可能要求日本大学在籍，不能只靠兴趣匹配推荐。','国内大学在籍が必要な可能性があり、興味だけで推薦しない。','May require Japan university enrollment and cannot be recommended by interest alone.'),intent:T('只把公开资料无法回答的少数问题交给正确的人。','公開情報で解けない少数の問題だけを適切な担当者へ。','Routes only a few unresolved questions to the responsible party.'),proposal:T('资源方回复产生的可完成任务，不是AI自行添加的泛化建议。','資源側回答から生成された実行可能タスク。AIの一般提案ではない。','An executable task created from provider feedback, not generic AI advice.'),alternative:T('保留可复用成果和替代节点，让失败只影响局部。','成果と代替ノードを保持し、失敗を局所化。','Keeps reusable work and alternatives so failure remains local.'),interview:T('涉及接收意愿和研究判断时，由有权人员面谈。','受入意向と研究判断は権限者が面談。','An authorized person handles willingness and research judgment.'),application:T('正式申请、录取和结果始终进入机构官方系统。','正式出願・合否は機関公式システムへ。','Formal application and outcomes always move to the provider’s official system.')}[n.id];el.innerHTML=`<span class="tag blue">${esc(n.id)}</span><h3 style="margin-top:10px">${esc(local(n.name))}</h3><p>${esc(local(desc))}</p><div class="button-row"><button class="btn small secondary" data-go="evidence">${esc(I18N[state.lang].navEvidence)}</button>${['lab-a','lab-b','industry-program'].includes function renderResources(root){const d=I18N[state.lang];let list=resources.filter(r=>state.resourceFilter==='all'||r.kind===state.resourceFilter).filter(r=>{const q=state.resourceSearch.toLowerCase();return !q||(local(r.name)+' '+local(r.owner)+' '+local(r.outcome)).toLowerCase().includes(q)});root.innerHTML=`<section class="view">${pageHead('VERIFIED RESOURCE MARKET',d.resourcesTitle,d.resourcesLead,`<button class="btn primary" data-go="intent">${esc(d.navIntent)}</button>`)}<div class="resource-tools"><input class="control" id="resourceSearch" value="${esc(state.resourceSearch)}" placeholder="${esc(local(T('搜索学校、研究室、课程、奖学金或企业项目','大学・研究室・科目・奨学金・企業を検索','Search university, lab, course, scholarship or company project')))}"><div class="filters">${['all','lab','course','scholarship','industry','official'].map(k=>`<button class="filter ${state.resourceFilter===k?'active':''}" data-resource-filter="${k}">${esc(k==='all'?local(T('全部','すべて','All')):kindLabel(k))}</button>`).join('')}</div></div><div class="resource-grid">${list.length?list.map(r=>`<article class="resource-card"><div class="resource-head"><div class="resource-meta"><span class="tag blue">${esc(kindLabel(r.kind))}</span>${resourceStatus(r)}</div><h3>${esc(local(r.name))}</h3><div class="owner">${esc(local(r.owner))}</div></div><div class="resource-body"><div class="resource-row"><b>${esc(local(T('获得结果','得られる結果','Outcome')))}</b><span>${esc(local(r.outcome))}</span></div><div class="resource-row"><b>${esc(local(T('主要条件','主な条件','Requirements')))}</b><span>${esc(local(r.condition))}</span></div><div class="resource-row"><b>${esc(local(T('时间','期間','Time')))}</b><span>${esc(local(r.time))}</span></div><div class="resource-row"><b>${esc(local(T('费用','費用','Cost')))}</b><span>${esc(local(r.cost))}</span></div><div class="resource-row"><b>${esc(local(T('证据/接入','根拠/接続','Evidence/integration')))}</b><span>${esc(evidenceLabel(r.evidence))} · ${esc(r.integration)} · ${esc(r.verified)}</span></div><div class="resource-next function renderIntent(root){const d=I18N[state.lang],r=resourceById(state.intentResource)||resources[0];root.innerHTML=`<section class="view">${pageHead('STRUCTURED INTENT',d.intentTitle,d.intentLead,`<button class="btn secondary" data-go="resources">${esc(d.navResources)}</button>`)}<div class="intent-layout"><div class="intent-steps"><div class="intent-box"><h3>1. ${esc(local(T('选择具体对象','対象資源を選択','Choose a resource')))}</h3><select class="control" id="intentResource">${resources.filter(x=>['lab','course','scholarship','industry'].includes(x.kind)).map(x=>`<option value="${x.id}">${esc(local(x.name))}</option>`).join('')}</select></div><div class="intent-box"><h3>2. ${esc(local(T('本次目的','今回の目的','Purpose')))}</h3><select class="control" id="intentPurpose">${purposeOptions().map(x=>`<option value="${x.id}">${esc(local(x.t))}</option>`).join('')}</select></div><div class="intent-box"><h3>3. ${esc(local(T('为什么联系','連絡理由','Why this resource')))}</h3><textarea class="control" id="intentWhy">${esc(local(state.intentWhy))}</textarea></div><div class="intent-box"><h3>4. ${esc(local(T('已经具备什么','現在持っているもの','What you already have')))}</h3><textarea class="control" id="intentHave">${esc(local(state.intentHave))}</textarea></div><div class="intent-box"><h3>5. ${esc(local(T('希望确认的问题（最多3项）','確認したい質問（最大3件）','Questions to confirm (max 3)')))}</h3><div class="question-list" id="questionList"></div><button class="btn soft" id="addQuestion" ${state.questions.length>=3?'disabled':''}>+ ${esc(d.addQuestion)}</button></div><div class="intent-box"><h3>6. ${esc(local(T('本次允许共享的资料','今回共有を許可する情報','Information authorized for this request')))}</h3><div class="share-grid">${Object.entries({education:T('学历与专业摘要','学歴・専攻要約','Education and major summary'),language:T('语言成绩摘要','語学要約','Language summary'),projects:T('研究与项目摘要','研究・プロジェクト要約','Research and project summary'),targetTime:T('目标时间','目標時期','Target timing'),cv:T('学术简历','学術CV','Academic CV'),identity:T('姓名','氏名','Name'),contact:T('联系方式','連絡先','Contact details'),fullFiles:T('完整材料','完全書類','Full files')}).map(([k,l])=>`<label class="share"><input type="checkbox" data-share="${k}" ${state.share[k]?'checked':''}><span>${esc(local(l))}${['identity','contact','fullFiles'].includes(k)?` <b>(${esc(local(T('默认关闭','初期OFF','off by default')))})</b>`:''}</span></label>`).join('')}</div></div><button class="btn primary" id="saveIntent">${esc(d.sendIntent)}</button></div><aside class="preview sticky"><small>${esc(local(T('资源方将看到','資源側に表示される内容','What the provider will see')))}</small><h3>${esc(local(r.name))}</h3><div id="intentPreview"></div><div class="price-note"><b>${esc(local(T('收费点：真实连接与回复后重规划','課金点：実在接続と回答後再計画','Paid value: real connection and reply-driven replanning')))}</b><br>${esc(local(T('免费预览不会自动发送。正式发送、追踪、人工复核与回复后详细规划属于付费服务。','無料プレビューは自動送信されません。送信、追跡、確認、回答後の詳細計画は有料です。','Free preview never sends automatically. Delivery, tracking, review and reply-driven detailed planning are paid services.')))}</div></aside></div></section>`;document.getElementById('intentResource').value=r.id;document.getElementById('intentPurpose').value=state.intentPurpose;renderQuestions();renderIntentPreview();document.getElementById('intentResource').onchange=e=>{state.intentResource=e.target.value;render()};document.getElementById('intentPurpose').onchange=e=>{state.intentPurpose=e.target.value;renderIntentPreview();saveState()};document.getElementById('intentWhy').oninput=e=>{state.intentWhy=e.target.value;renderIntentPreview()};document.getElementById('intentHave').oninput=e=>{state.intentHave=e.target.value;renderIntentPreview()};document.querySelectorAll('[data-share]').forEach(x=>x.onchange=()=>{state.share[x.dataset.share]=x.checked;renderIntentPreview();saveState()});document.getElementById('addQuestion').onclick=()=>{if(state.questions.length<3){state.questions.push('');renderQuestions();renderIntentPreview();saveState()}};document.getElementById('saveIntent').onclick=saveIntent}

function openOnboarding(){const d=I18N[state.lang];document.getElementById('modalKicker').textContent='PROVIDER ONBOARDING';document.getElementById('modalTitle').textContent=local(T('创建机构接入后的预览','機関参加後のプレビュー作成','Create a provider onboarding preview'));document.getElementById('modalBody').innerHTML=`<div class="onboarding"><div class="onboarding-steps">${[T('基本身份','基本情報','Identity'),T('未来方向','将来方向','Future direction'),T('现有资源','現在資源','Current resources'),T('现实条件','現実条件','Current conditions'),T('受理与回复','受付・回答','Intake and replies')].map((x,i)=>`<div class="onboarding-step ${state.onboardingStep===i?'active':''}"><b>${i+1}. ${esc(local(x))}</b><span>${esc(local(T('演示步骤','デモステップ','Demo step')))}</span></div>`).join('')}</div><div class="panel soft"><div class="field"><label>${esc(local(T('机构名称','機関名','Provider name')))}</label><input class="control" value="演示研究室/机构"></div><div class="field" style="margin-top:9px"><label>${esc(local(T('请用普通语言说明这个阶段','この段階を平易な言葉で説明','Describe this step in plain language')))}</label><textarea class="control">${esc(local(T('我们希望被什么样的人发现，当前能够提供什么，哪些条件必须先满足。','どのような人に見つけてほしいか、何を提供でき、何を先に満たす必要があるか。','Who should discover us, what can we provide, and which conditions must be met first.')))}</textarea></div><div class="priority-note">${esc(local(T('机构不需要先提供API。可以从公开资料预览、认领、轻量收件箱和人工回复开始。','最初からAPIは不要。公開情報プレビュー、認領、軽量受信箱、人による回答から開始可能。','An API is not required at the start. Begin with public-data preview, claim, a lightweight inbox and human replies.')))}</div></div></div>`;document.getElementById('modalFoot').innerHTML=`<button class="btn secondary" id="onboardBack" ${state.onboardingStep===0?'disabled':''}>${esc(d.back)}</button><button class="btn primary" id="onboardNext">${esc(state.onboardingStep===4?local(T('完成预览','プレビュー完成','Finish preview')):d.next)}</button>`;document.getElementById('modal').showModal();document.getElementById('onboardBack').onclick=()=>{state.onboardingStep=Math.max(0,state.onboardingStep-1);document.getElementById('modal'). function renderTech(root){const d=I18N[state.lang];root.innerHTML=`<section class="view">${pageHead('PREDICTION ARCHITECTURE',d.techTitle,d.techLead,`<button class="btn secondary" data-go="trust">${esc(d.navTrust)}</button>`)}<div class="tech-grid"><article class="tech-card"><span class="tag blue">PATH REASONING</span><h3>hopwise / Knowledge Graph</h3><p>${esc(local(T('借鉴知识图谱中的可解释路径推理：不仅给候选，还显示“用户—条件—资源—结果”的理由链。','知識グラフの説明可能な経路推論を参考に、候補だけでなく理由経路を表示。','Use explainable path reasoning over knowledge graphs to show the user-condition-resource-outcome chain.')))}</p><a href="https://github.com/tail-unica/hopwise" target="_blank" rel="noopener">GitHub ↗</a></article><article class="tech-card"><span class="tag blue">GRAPH RAG</span><h3>Microsoft GraphRAG</h3><p>${esc(local(T('从募集要项、官网、论文和机构资料提取实体与关系，并保存来源；不把昂贵索引作为第一版前提。','募集要項・Web・論文・機関資料から実体と関係を抽出し出典を保存。高コスト索引をMVP前提にしない。','Extract entities and relations from guides, web pages, papers and provider data while preserving provenance; do not make expensive indexing an MVP prerequisite.')))}</p><a href="https://github.com/microsoft/graphrag" target="_blank" rel="noopener">GitHub ↗</a></article><article class="tech-card"><span class="tag green">CONSTRAINTS</span><h3>Google OR-Tools / CP-SAT</h3><p>${esc(local(T('学历、时间、预算、身份、名额和截止日期属于约束；先找可行解，再做多目标排序。','学歴、時間、予算、在籍、定員、締切は制約。実行可能解を先に探し、その後に多目的順位付け。','Degree, time, budget, status, capacity and deadlines are constraints. Find feasible solutions before multi-objective ranking.')))}</p><a href="https://developers.google.com/optimization" target="_blank" rel="noopener">Official docs ↗</a></article><article class="tech-card"><span class="tag purple">WHAT-IF</span><h3>PyWhy / DoWhy</h3><p>${esc(local(T('在数据和假设足够时用于干预与反事实分析；当前演示只做条件式情景，不把相关性包装成因果。','十分なデータと仮定がある場合のみ介入・反実仮想へ。現デモは条件付きシナリオで因果を主張しない。','Use for interventions and counterfactuals only with adequate data and assumptions; this demo does not turn correlation into causality.')))}</p><a href="https://github.com/py-why/dowhy" target="_blank" rel="noopener">GitHub ↗</a></article><article class="tech-card"><span class="tag amber">DURABLE FLOW</span><h3>Temporal-style workflow</h3><p>${esc(local(T('回复可能等待数周；工作流需要支持超时、补资料、提醒、转介、重试和恢复。','回答待ちは数週間に及ぶため、期限、補足、通知、紹介、再試行、復元が必要。','Replies may take weeks, so workflows need timeouts, information requests, reminders, referrals, retries and recovery.')))}</p><a href="https://docs.temporal.io/" target="_blank" rel="noopener">Official docs ↗</a></article><article class="tech-card"><span class="tag red">GOVERNANCE</span><h3>NIST AI RMF</h3><p>${esc(local(T('用Govern、Map、Measure、Manage组织来源、权限、评测、人工确认、异常和版本。','Govern・Map・Measure・Manageで出典、権限、評価、人確認、異常、版を管理。','Use Govern, Map, Measure and Manage for provenance, permissions, evaluation, human approval, incidents and versioning.')))}</p><a href="https://www.nist.gov/itl/ai-risk-management-framework" target="_blank" rel="noopener">NIST ↗</a></article></div><div class="panel section"><h2>${esc(local(T('系统分层','システム層','System layers')))}</h2><div class="architecture"><div class="arch-row"><div class="arch-label">EXPERIENCE</div><div class="arch-modules"><div class="arch-module">Student planner</div><div class="arch-module">Resource marketplace</div><div class="arch-module">Intent & replies</div><div class="arch-module">Provider workbench</div></div></div><div class="arch-row"><div class="arch-label">DECISION</div><div class="arch-modules"><div class="arch-module">Constraint engine</div><div class="arch-module">Route ranking</div><div class="arch-module">Scenario simulator</div><div class="arch-module">Task/state machine</div></div></div><div class="arch-row"><div class="arch-label">KNOWLEDGE</div><div class="arch-modules"><div class="arch-module">Resource graph</div><div class="arch-module">Rule/version store</div><div class="arch-module">Evidence ledger</div><div class="arch-module">Document parsing</div></div></div><div class="arch-row"><div class="arch-label">TRUST</div><div class="arch-modules"><div class="arch-module">Identity & authority</div><div class="arch-module">Field permissions</div><div class="arch-module">Audit & consent</div><div class="arch-module">Human review</div></div></div><div class="arch-row"><div class="arch-label">INTEGRATION</div><div class="arch-modules"><div class="arch-module">Email / forms</div><div class="arch-module">Calendar / CRM</div><div class="arch-module">SIS / ATS</div><div class="arch-module">API / Webhook</div></div></div></div></div></section>`}
function runChecks(){const ids=[...document.querySelectorAll('[id]')].map(x=>x.id);const dup=ids.filter((x,i)=>ids.indexOf(x)!==i);const checks=[{n:T('重复ID','重複ID','Duplicate IDs'),ok:dup.length===0,v:dup.length?dup.join(', '):'0'},{n:T('页面语言声明','ページ言語','Document language'),ok:document.documentElement.lang.length>0,v:document.documentElement.lang},{n:T('无undefined文本','undefined文字なし','No undefined text'),ok:!document.body.innerText.includes('undefined'),v:document.body.innerText.includes('undefined')?'FAIL':'PASS'},{n:T('关键交互数据','主要データ','Core interaction data'),ok:routes.length>=5&&resources.length>=8&&replyTypes.length===8,v:`${routes.length}/${resources.length}/${replyTypes.length}`},{n:T('Intent问题上限','Intent質問上限','Intent question limit'),ok:state.questions.length<=3,v:String(state.questions.length)},{n:T('默认隐私设置','初期プライバシー','Default privacy'),ok:!defaultState.share.identity&&!defaultState.share.contact&&!defaultState.share.fullFiles,v:'PASS'},{n:T('三语字典','3言語辞書','Three-language dictionary'),ok:['zh','ja','en'].every(k=>I18N[k]),v:'zh/ja/en'},{n:T('LocalStorage','LocalStorage','LocalStorage'),ok:true,v:'enabled'}];return checks}
function renderTrust(root){const d=I18N[state.lang],checks=runChecks();root.innerHTML=`<section class="view">${pageHead('TRUST & BOUNDARIES',d.trustTitle,d.trustLead,`<button class="btn secondary" data-go="tech">${esc(d.navTech)}</button><button class="btn primary" id="selfCheck">${esc(d.selfCheck)}</button>`)}<div class="trust-grid"><article class="trust-card"><i>01</i><h3>${esc(local(T('系统建议','システム提案','System suggestion')))}</h3><p>${esc(local(T('来自用户资料、公开信息和模型推理，通常不能直接行动。','利用者情報、公開情報、推論。通常は直接行動不可。','Based on user data, public information and inference; usually not directly actionable.')))}</p></article><article class="trust-card"><i>02</i><h3>${esc(local(T('官方资料','公式資料','Official source')))}</h3><p>${esc(local(T('官网、PDF、数据库和正式规则，仍需注意版本与适用范围。','公式Web、PDF、DB、規則。版と適用範囲に注意。','Official web, PDF, database and rules with version and scope.')))}</p></article><article class="trust-card"><i>03</i><h3>${esc(local(T('机构确认','機関確認','Provider confirmation')))}</h3><p>${esc(local(T('显示回复人、回答权限、行动范围、正式效力与有效期。','回答者、権限、行動範囲、正式効力、有効期を表示。','Show responder, authority, action scope, formal effect and validity.')))}</p></article><article class="trust-card"><i>04</i><h3>${esc(local(T('正式结果','正式結果','Formal outcome')))}</h3><p>${esc(local(T('录取、雇用、奖学金、签证等由有权机构正式系统作出。','合否、採用、奨学金、在留は権限機関の正式システムが決定。','Admission, employment, scholarship and visa are decided by authorized official systems.')))}</p></article></div><div class="grid-2 section"><div class="panel"><h2>${esc(local(T('平台提前做好什么','事前に行うこと','What the platform prepares')))}</h2><div class="boundary-list"><div class="boundary good"><b>${esc(local(T('整理目标、条件、预算与时间','目標・条件・予算・時間を整理','Organize goals, conditions, budget and time'))}</b><p>${esc(local(T('只收集当前任务需要的最小信息。','現在タスクに必要な最小情報のみ。','Collect only minimum information needed for the task.')))}</p></div><div class="boundary good"><b>${esc(local(T('核验来源和规则版本','出典・規則版を確認','Verify sources and rule versions'))}</b><p>${esc(local(T('保留原文、提取结果、适用范围和更新时间。','原文、抽出、適用範囲、更新時期を保持。','Keep source text, extraction, scope and update time.'))}</p></div><div class="boundary good"><b>${esc(local(T('生成结构化Intent','構造化Intentを作成','Create structured Intent'))}</b><p>${esc(local(T('减少泛化邮件和反复追问。','一般的な長文メールと往復を減らす。','Reduce generic outreach and repeated questions.'))}</p></div><div class="boundary good"><b>${esc(local(T('把回复转成任务与替代','回答をタスク・代替へ','Convert replies into tasks and alternatives'))}</b><p>${esc(local(T('保留版本、负责人、期限和人工修正。','版、担当、期限、人修正を保持。','Preserve version, owner, deadline and human correction.'))}</p></div></div></div><div class="panel"><h2>${esc(local(T('平台明确不做什么','行わないこと','What the platform does not do')))}</h2><div class="boundary-list"><div class="boundary bad"><b>${esc(local(T('不替机构作正式决定','正式決定を代替しない','No formal decisions for providers'))}</b><p>${esc(local(T('不替代录取、招聘、奖学金、签证或法律判断。','合否、採用、奨学金、在留、法務を代替しない。','No admission, hiring, scholarship, visa or legal decisions.'))}</p></div><div class="boundary bad"><b>${esc(local(T('不卖虚假概率','偽の確率を販売しない','No false probability selling'))}</b><p>${esc(local(T('路线分数只用于比较，不包装成成功率。','ルート点数は比較用で成功率ではない。','Route scores are for comparison, not success rates.'))}</p></div><div class="boundary bad"><b>${esc(local(T('不未经授权共享','無断共有しない','No unauthorized sharing'))}</b><p>${esc(local(T('姓名、联系方式、证件和完整材料默认关闭。','氏名、連絡先、証明書、完全書類は初期OFF。','Name, contacts, IDs and full files are off by default.'))}</p></div><div class="boundary bad"><b>${esc(local(T('不让商业合作改变自然排序','商業関係で自然順位を変えない','No paid distortion of natural ranking'))}</b><p>${esc(local(T('推广和分成必须透明标注。','広告・分配は明示する。','Promotion and revenue sharing must be disclosed.'))}</p></div></div></div></div><div class="panel section"><h2>${esc(local(T('页面自检','ページ自己点検','Page self-check')))}</h2><div class="selfcheck" id="selfcheckResults">${checks.map(c=>`<div class="check-result ${c.ok?'pass':'fail'}"><b>${esc(local(c.n))}</b><span>${c.ok?'PASS':'FAIL'} · ${esc(c.v)}</span></div>`).join('')}</div></div></section>`;document.getElementById('selfCheck').onclick=()=>{toast(checks.every(c=>c.ok)?local(T('当前自检全部通过。','現在の自己点検は全て合格。','All current self-checks passed.')):local(T('存在需要修复的自检项。','修正が必要な項目があります。','Some self-checks need attention.')));render()}}
